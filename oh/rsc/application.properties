# logging.file.name=oh-rest-api.log
# logging.level.org.springframework=DEBUG
# logging.level.org.springframework.web=DEBUG
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%t %a "%r" %s (%D ms)
spring.jpa.hibernate.use-new-id-generator-mappings=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.servlet.context-path=/
server.address=localhost
server.port=8080
server.servlet.session.cookie.http-only=true
#server.servlet.session.cookie.secure=true # only over HTTPS
spring.pid.fail-on-write-error=true
spring.pid.file=
spring.mustache.check-template-location=false
spring.jpa.open-in-view=false

### In production change to http://<domain>
cors.allowed.origins=http://localhost:8080,http://localhost:8080

### Swagger-UI (info)
api.host=localhost:8080/oh-api
api.protocol=http
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none

### Security token secret (JWT)
jwt.token.secret=AdZ1azzNGlhWSb0JPHFXN79QPBlinrLy1spKyzejulAH6c9OnTSIzPqB9lsipmv4x2

### JWT token validity, 30 minutes (1,800 seconds)
jwt.token.validityInSeconds=1800

### JWT token validity for remember me, 3 days (259,200 seconds)
jwt.token.validityInSecondsForRememberMe=259200

# Hibernate properties
# needed to start application even without DB connection
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=none

### Security hardening - do not disclose technical/version information (OP-890, STRIDE I03)
# Error responses must not leak messages, stack traces or exception class names
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
# Return a clean 404 for unknown paths instead of a detailed error page
spring.mvc.throw-exception-if-no-handler-found=true
# Suppress the server identification (version) header
server.server-header=
